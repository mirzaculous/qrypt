<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qrypt — Pakistan's Smartest Ticketing System</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#01f080;--green-dim:#00b85f;--green-glow:rgba(1,240,128,0.15);--green-glow-strong:rgba(1,240,128,0.3);--off-white:#f0f1f1;--bg:#060a07;--bg2:#0c110e;--bg3:#101710;--border:rgba(1,240,128,0.12);--border-strong:rgba(1,240,128,0.3);--text-muted:rgba(240,241,241,0.5);--text-dim:rgba(240,241,241,0.75)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--off-white);font-family:'Space Grotesk',sans-serif;overflow-x:hidden}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 0.8s ease,visibility 0.8s ease}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.qr-loader{width:100px;height:100px;animation:qr-spin 2s linear infinite}
@keyframes qr-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loader-text{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:0.3em;color:var(--green);text-transform:uppercase;animation:pulse-text 1s ease-in-out infinite alternate}
@keyframes pulse-text{from{opacity:0.4}to{opacity:1}}
.loader-bar{width:180px;height:1px;background:var(--border);position:relative;overflow:hidden}
.loader-bar::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:bar-slide 1.2s ease-in-out infinite}
@keyframes bar-slide{to{left:200%}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:18px 40px;background:rgba(6,10,7,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:padding 0.3s}
.nav-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--green);letter-spacing:-0.02em;text-decoration:none}
.nav-logo span{color:var(--off-white)}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;transition:color 0.2s}
.nav-links a:hover{color:var(--green)}
.nav-cta{background:var(--green);color:var(--bg);padding:10px 22px;border-radius:4px;font-size:13px;font-weight:700;text-decoration:none;transition:background 0.2s,transform 0.2s;white-space:nowrap}
.nav-cta:hover{background:#00cc6a;transform:translateY(-1px)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--off-white);border-radius:2px;transition:all 0.3s}
.mobile-menu{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.mobile-menu.open{display:flex}
.mobile-menu a{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--off-white);text-decoration:none;transition:color 0.2s}
.mobile-menu a:hover{color:var(--green)}
.mobile-close{position:absolute;top:24px;right:24px;font-size:28px;color:var(--text-muted);cursor:pointer;background:none;border:none}

/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 80px;position:relative;overflow:hidden}
.hero-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(1,240,128,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(1,240,128,0.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%)}
.hero-orb{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(1,240,128,0.07) 0%,transparent 70%);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(1,240,128,0.08);border:1px solid var(--border-strong);border-radius:100px;padding:6px 16px;font-size:11px;font-weight:600;color:var(--green);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:28px;position:relative}
.badge-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.hero-headline{font-family:'Syne',sans-serif;font-size:clamp(42px,8vw,96px);font-weight:800;line-height:0.95;letter-spacing:-0.03em;margin-bottom:24px;position:relative}
.hero-headline .green{color:var(--green)}
.hero-sub{font-size:clamp(15px,2vw,19px);color:var(--text-muted);max-width:540px;line-height:1.6;margin-bottom:40px;position:relative}
.hero-sub strong{color:var(--off-white);font-weight:600}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;position:relative}
.btn-primary{background:var(--green);color:var(--bg);padding:15px 32px;border-radius:4px;font-size:15px;font-weight:700;text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}
.btn-primary:hover{background:#00e876;transform:translateY(-2px);box-shadow:0 8px 30px rgba(1,240,128,0.3)}
.btn-ghost{background:transparent;color:var(--off-white);padding:15px 32px;border-radius:4px;font-size:15px;font-weight:600;text-decoration:none;border:1px solid var(--border-strong);transition:all 0.2s}
.btn-ghost:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}
.hero-stats{display:flex;gap:40px;margin-top:60px;position:relative;padding-top:40px;border-top:1px solid var(--border);flex-wrap:wrap;justify-content:center}
.stat-item{text-align:center}
.stat-num{font-family:'Syne',sans-serif;font-size:clamp(28px,4vw,36px);font-weight:800;color:var(--green);display:block}
.stat-label{font-size:12px;color:var(--text-muted);letter-spacing:0.04em;margin-top:4px}

/* TICKER */
.ticker-wrap{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 0;background:var(--bg2)}
.ticker-track{display:flex;animation:ticker-scroll 22s linear infinite;width:max-content}
@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:14px;padding:0 32px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap}
.ticker-dot{color:var(--green);font-size:16px}

/* SECTION BASE */
.section-tag{font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--green);margin-bottom:16px;display:block}
.section-title{font-family:'Syne',sans-serif;font-size:clamp(32px,5vw,60px);font-weight:800;line-height:1.05;letter-spacing:-0.02em;margin-bottom:20px}
.line-accent{width:50px;height:3px;background:var(--green);border-radius:2px;margin-bottom:20px}

/* WHAT */
#what{padding:100px 40px;max-width:1200px;margin:0 auto}
.what-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;margin-top:50px}
.what-text p{font-size:16px;line-height:1.8;color:var(--text-dim);margin-bottom:18px}
.what-text p strong{color:var(--green);font-weight:600}
.what-visual{display:flex;align-items:center;justify-content:center;position:relative;min-height:280px}
.qr-demo{width:200px;height:200px;background:var(--bg3);border:1px solid var(--border-strong);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.qr-demo::before{content:'';position:absolute;inset:-2px;background:conic-gradient(from 0deg,transparent,var(--green),transparent);border-radius:14px;animation:qr-border-spin 3s linear infinite;z-index:-1}
@keyframes qr-border-spin{to{transform:rotate(360deg)}}
.qr-code-inner{animation:qr-fade 3s ease-in-out infinite}
@keyframes qr-fade{0%,100%{opacity:1;transform:scale(1)}45%{opacity:0;transform:scale(0.85)}55%{opacity:0;transform:scale(0.85)}}
.countdown-ring{position:absolute;bottom:-20px;right:-16px;width:72px;height:72px;background:var(--bg2);border:1px solid var(--border-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.countdown-num{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--green);line-height:1}
.countdown-label{font-size:8px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase}
.geo-badge{position:absolute;top:-14px;left:-16px;background:var(--bg2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px}
.geo-pulse{width:7px;height:7px;background:var(--green);border-radius:50%;animation:geo-ping 1.5s ease-out infinite}
@keyframes geo-ping{0%{box-shadow:0 0 0 0 var(--green-glow-strong)}100%{box-shadow:0 0 0 10px transparent}}

/* HOW */
#how{padding:100px 40px;background:var(--bg2);position:relative;overflow:hidden}
#how::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.how-inner{max-width:1200px;margin:0 auto}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:60px}
.step-card{background:var(--bg3);padding:30px 24px;position:relative;border:1px solid var(--border);transition:border-color 0.3s,background 0.3s;overflow:hidden}
.step-card:first-child{border-radius:12px 0 0 12px}
.step-card:last-child{border-radius:0 12px 12px 0}
.step-card:hover{border-color:var(--border-strong);background:rgba(1,240,128,0.03)}
.step-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--green);transform:scaleX(0);transition:transform 0.3s;transform-origin:left}
.step-card:hover::after{transform:scaleX(1)}
.step-num{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:rgba(1,240,128,0.07);line-height:1;margin-bottom:14px;display:block}
.step-icon{width:44px;height:44px;background:var(--green-glow);border:1px solid var(--border-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:20px}
.step-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;margin-bottom:10px;color:var(--off-white)}
.step-desc{font-size:13px;line-height:1.7;color:var(--text-muted)}

/* FEATURES */
#features{padding:100px 40px;max-width:1200px;margin:0 auto}
.bento-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:60px}
.bento-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px;transition:border-color 0.3s,transform 0.3s;position:relative;overflow:hidden}
.bento-card:hover{border-color:var(--border-strong);transform:translateY(-4px)}
.bento-card.wide{grid-column:span 2}
.bento-icon{font-size:32px;margin-bottom:16px;display:block}
.bento-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:10px}
.bento-title .green{color:var(--green)}
.bento-desc{font-size:13px;line-height:1.7;color:var(--text-muted)}
.bento-bg-text{position:absolute;bottom:-16px;right:-8px;font-family:'Syne',sans-serif;font-size:80px;font-weight:800;color:rgba(1,240,128,0.03);line-height:1;pointer-events:none;user-select:none}

/* PRICING */
#pricing{padding:100px 40px;background:var(--bg2);position:relative;overflow:hidden}
#pricing::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.pricing-inner{max-width:960px;margin:0 auto;text-align:center}
.pricing-hero{margin-top:50px;background:var(--bg3);border:1px solid var(--border-strong);border-radius:24px;padding:50px 40px;position:relative;overflow:hidden}
.pricing-badge{display:inline-block;background:rgba(1,240,128,0.1);border:1px solid var(--border-strong);color:var(--green);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:6px 16px;border-radius:100px;margin-bottom:28px}
.price-amount{font-family:'Syne',sans-serif;font-size:clamp(64px,12vw,110px);font-weight:800;color:var(--green);line-height:1;letter-spacing:-0.04em;margin-bottom:8px}
.price-unit{font-size:17px;color:var(--text-muted);margin-bottom:28px;display:block}
.price-features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px;padding-top:40px;border-top:1px solid var(--border);text-align:left}
.price-feat{display:flex;align-items:flex-start;gap:10px}
.price-feat-check{width:20px;height:20px;background:var(--green-glow);border:1px solid var(--border-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:var(--green);margin-top:2px}
.price-feat-text{font-size:13px;color:var(--text-dim);line-height:1.5}
.price-feat-text strong{color:var(--off-white);display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.pricing-cta{margin-top:40px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ABOUT */
#about{padding:100px 40px;max-width:1200px;margin:0 auto}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;margin-top:50px}
.about-text p{font-size:16px;line-height:1.8;color:var(--text-dim);margin-bottom:18px}
.about-text p strong{color:var(--green)}
.about-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.about-tag{background:rgba(1,240,128,0.06);border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500}
.about-visual{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px}
.about-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.about-stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:22px}
.about-stat-card .num{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:var(--green);display:block}
.about-stat-card .label{font-size:12px;color:var(--text-muted);margin-top:4px}
.about-quote{margin-top:16px;padding:22px;background:var(--bg3);border:1px solid var(--border);border-radius:12px}
.about-quote p{font-size:13px;color:var(--text-muted);line-height:1.7;font-style:italic}
.about-quote .author{font-size:13px;color:var(--green);margin-top:10px;font-weight:600}

/* CONTACT */
#contact{padding:100px 40px;background:var(--bg2);position:relative;overflow:hidden}
#contact::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.contact-inner{max-width:1000px;margin:0 auto}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:50px}
.contact-info h3{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:14px}
.contact-info p{font-size:15px;line-height:1.7;color:var(--text-muted);margin-bottom:28px}
.contact-links{display:flex;flex-direction:column;gap:12px}
.contact-link{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;text-decoration:none;transition:border-color 0.2s,transform 0.2s}
.contact-link:hover{border-color:var(--border-strong);transform:translateX(4px)}
.contact-link-icon{width:34px;height:34px;background:var(--green-glow);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--green);flex-shrink:0}
.contact-link-text strong{display:block;color:var(--off-white);font-size:13px;font-weight:600}
.contact-link-text span{font-size:12px;color:var(--text-muted)}
.contact-form{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted)}
.form-group input,.form-group textarea,.form-group select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:13px 14px;color:var(--off-white);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;resize:none;-webkit-appearance:none}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--border-strong);box-shadow:0 0 0 3px var(--green-glow)}
.form-group input::placeholder,.form-group textarea::placeholder{color:rgba(240,241,241,0.2)}
.form-group select option{background:var(--bg3);color:var(--off-white)}
.form-submit{background:var(--green);color:var(--bg);border:none;padding:15px 32px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;width:100%;letter-spacing:0.02em}
.form-submit:hover{background:#00e876;transform:translateY(-2px);box-shadow:0 8px 30px rgba(1,240,128,0.3)}
.form-submit:disabled{opacity:0.7;cursor:not-allowed;transform:none}
.form-msg{text-align:center;font-size:14px;padding:12px;border-radius:8px;display:none}
.form-msg.success{display:block;background:rgba(1,240,128,0.1);border:1px solid var(--border-strong);color:var(--green)}
.form-msg.error{display:block;background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);color:#ff8080}

/* BIG FOOTER */
.footer-main{background:var(--bg);border-top:1px solid var(--border);padding:80px 40px 40px}
.footer-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:50px;padding-bottom:60px;border-bottom:1px solid var(--border)}
.footer-brand .logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--green);margin-bottom:14px;display:block}
.footer-brand p{font-size:13px;color:var(--text-muted);line-height:1.7;max-width:260px;margin-bottom:20px}
.footer-social{display:flex;gap:10px}
.social-btn{width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;text-decoration:none;transition:border-color 0.2s,transform 0.2s}
.social-btn:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.footer-col h4{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--off-white);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:18px}
.footer-col ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.footer-col ul a{font-size:13px;color:var(--text-muted);text-decoration:none;transition:color 0.2s}
.footer-col ul a:hover{color:var(--green)}
.footer-bottom{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding-top:32px;flex-wrap:wrap;gap:16px}
.footer-bottom p{font-size:12px;color:var(--text-muted)}
.footer-bottom p strong{color:var(--green)}
.footer-bottom-links{display:flex;gap:20px;list-style:none}
.footer-bottom-links a{font-size:12px;color:var(--text-muted);text-decoration:none;transition:color 0.2s}
.footer-bottom-links a:hover{color:var(--green)}

/* WHATSAPP FLOAT */
.wa-float{position:fixed;bottom:28px;right:28px;z-index:998;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.wa-bubble{background:#25D366;border-radius:50%;width:58px;height:58px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(37,211,102,0.4);cursor:pointer;text-decoration:none;animation:wa-bounce 3s ease-in-out infinite;transition:transform 0.2s,box-shadow 0.2s}
.wa-bubble:hover{transform:scale(1.1);box-shadow:0 6px 32px rgba(37,211,102,0.6);animation:none}
@keyframes wa-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wa-bubble svg{width:30px;height:30px;fill:#fff}
.wa-tooltip{background:var(--bg2);border:1px solid var(--border-strong);color:var(--off-white);font-si
